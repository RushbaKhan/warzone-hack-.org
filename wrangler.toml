# CI Workers Builds project name (repo: warzonecheats)
name = "warzonehack"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://warzonehack.org 301s always apply
run_worker_first = true
